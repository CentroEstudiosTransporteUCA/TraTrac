# TraTrac persisted run config — copy to a real file and edit, then run:
#   uv run tratrac --config my_run.toml
#
# This file is a documentation TEMPLATE; it is not auto-loaded. A run is fully
# described by this config: there are NO built-in defaults, so EVERY key below
# is required, and there are NO per-key override flags — the config is the single
# source of truth. The only CLI flag is --force (overwrite policy; not a config key,
# since it never affects the trajectories). A "disabled" feature is still an explicit
# value, never a missing key: timing_csv = "" (off), start/end = "" (whole clip).
# See src/tratrac/application/CONFIG_DESIGN.md.
#
# The run is PERCEPTION ONLY: it writes the track record (export.out). It does not
# produce a .trj — run `tratrac-postprocess RECORD --transforms ... --out run.trj`
# afterwards (src/tratrac/application/SMOOTHING.md).
#
# `tratrac` never resolves any geometric transform itself (no GSD scale, no
# ego-motion, no world projection) -- input.transforms_in below always names a
# `tratrac-preprocess` run's output instead. Run that FIRST, even for a fully
# static camera (it's the only place scale gets resolved now):
#
#   tratrac-preprocess estimate clips/highway_run3.mp4 \
#       --out out/highway_run3.transforms.jsonl \
#       --meters-per-pixel 0.05
#       # or: --drone-model mavic_3 --altitude-m 80.0   (or --srt clip.SRT)
#       # add --background-zones bg.json --anchors-dir out/highway_run3.anchors/
#       # for a moving drone, to also estimate + remove ego-motion
#
# See src/tratrac/infrastructure/video/EGO_MOTION.md.

[input]
# The processed video and the transforms.jsonl `tratrac-preprocess estimate`
# (optionally followed by `project`, for world coordinates) already produced.
video = "clips/highway_run3.mp4"
process_fps = 0.0                 # cap processing to ~N frames/sec; 0.0 = every frame.
                                  # Decode-time decimation: faster on long clips, but fewer
                                  # frames => more BoT-SORT ID switches. See src/tratrac/infrastructure/TIMESTEP_PRECISION.md.
                                  # (.trj TIMESTEP decimation is a tratrac-postprocess flag now.)
transforms_in = "out/highway_run3.transforms.jsonl"

[detector]
name = "yolov8_visdrone"          # yolov8_visdrone | rt_detr | yolo_obb (not yet the default;
                                  # needs a fine-tuned checkpoint, see DETECTOR_CHOICE.md)
checkpoint = "Mahadih534/YoloV8-VisDrone"   # HF repo id (rt_detr e.g. PekingU/rtdetr_r18vd;
                                  # yolo_obb: a local .pt path or ultralytics-hub name)
conf = 0.25                       # detection confidence threshold, [0, 1]
filename = "visDrone.pt"          # weights file in the repo; required (unused by rt_detr/yolo_obb)

[runtime]
device = "cpu"                    # cpu | mps | cuda | cuda:0

[tracker]
det_thresh = 0.1                  # BoT-SORT detection threshold (kept below detector.conf)

# Kinematics (orientation/speed/accel) and the .trj are produced post-hoc by
# tratrac-postprocess from the record, not here — there is no [orientation] section.

[export]
out = "out/highway_run3.parquet"  # the track record (run's primary output, Parquet).
                                  # Feed it to tratrac-postprocess to get a .trj (src/tratrac/application/SMOOTHING.md).

[window]
start = ""                        # "" = clip start; else HH:MM:SS(.ms) / MM:SS / SS
end = ""                          # "" = clip end

# Exclusion zones are NOT a run setting — they are applied post-hoc and track-aware
# by `tratrac-postprocess --exclusion-zones zones.json --transforms out/highway_run3.transforms.jsonl`
# (the same file as input.transforms_in above; see src/tratrac/application/EXCLUSION_ZONES.md).

# Overwrite policy is NOT a config key — it never affects the trajectories. Use the
# `--force` CLI flag to overwrite existing outputs (default: off). See src/tratrac/application/CONFIG_DESIGN.md.
[run]
timing_csv = ""                   # "" = profiling off; else a CSV path for per-frame timings
