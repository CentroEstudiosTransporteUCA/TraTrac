[project]
name = "tratrac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SantiagoGarrote", email = "santiagogarrote2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "boxmot>=19.0.0",
    "dill>=0.4.1",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pyarrow>=24.0.0",
    "shapely>=2.1.2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "typer>=0.25.1",
    "ultralytics>=8.4.53",
]

# fiftyone is an opt-in extra (`uv sync --extra fiftyone`), not a core dependency: it's a
# post-hoc visualization tool over already-produced outputs (cli_fiftyone.py), never imported
# by the perception/postprocess/render pipeline itself, and it's heavy (~80 transitive packages
# incl. its own bundled MongoDB). Kept off the default `uv sync` so the core pipeline install
# stays lean. See `tool.uv.override-dependencies` below for why opencv-python-headless (a
# transitive fiftyone/voxel51-eta dependency) is excluded even when this extra is selected.
[project.optional-dependencies]
fiftyone = ["fiftyone>=1.21.0"]

[project.scripts]
tratrac = "tratrac.cli:app"
tratrac-postprocess = "tratrac.cli_postprocess:app"
tratrac-render = "tratrac.cli_render:app"
tratrac-fiftyone = "tratrac.cli_fiftyone:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# fiftyone (and its own dependency voxel51-eta) hard-require the "opencv-python-headless"
# distribution by name. Both it and our own "opencv-python" install files under the same
# site-packages/cv2/ path — installing both is a known, real conflict (confirmed here: with
# both present, cv2.__version__ silently reported opencv-python-headless's version, not our
# pinned one), and scripts/visualize_stabilization.py needs the GUI build (cv2.imshow) that
# headless doesn't ship. This override marks the headless requirement as never-applicable
# (an always-false marker), which excludes it from resolution/install entirely; fiftyone still
# imports fine at runtime because Python's `import cv2` is satisfied by our own opencv-python
# regardless of which distribution's metadata declared the requirement.
[tool.uv]
override-dependencies = ["opencv-python-headless; python_version < '0'"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (isort)
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]
ignore = [
    "W191",  # tab indentation (we use tabs)
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]  # fake adapters routinely take unused arguments to satisfy a Protocol

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
	"tratrac.domain.geometry.BoundingBox",
	"tratrac.domain.geometry.Dimensions",
	"tratrac.domain.geometry.Heading",
	"tratrac.domain.geometry.Point2D",
	"tratrac.domain.geometry.Vector2D",
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
	"av.*",
	"boxmot.*",
	"cv2.*",
	"fiftyone.*",
	"huggingface_hub.*",
	"pyarrow.*",
	"tqdm.*",
	"transformers.*",
	"ultralytics.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
	"slow: requires model downloads or real video processing; skipped by default",
]
